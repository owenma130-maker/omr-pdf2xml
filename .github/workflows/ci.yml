name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 测试
        run: pytest -q
      - name: 命令行可用性
        run: |
          omr --help
          omr status

  # 发布前的法律预检：仓库里不得出现任何商业 OMR 软件的逆向产物或派生数据。
  # 规则见 tools/legal_preflight.py（随仓库发布）。
  legal-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 法律预检（零命中才算通过）
        run: python tools/legal_preflight.py --path .
